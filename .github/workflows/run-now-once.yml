name: Run Job Alert Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: job-alert-agent-results
  cancel-in-progress: false

jobs:
  run-now:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Fetch current matches
        run: python -m job_agent.main fetch

      - name: Send test report email
        run: python -m job_agent.main report

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-job-test-run
          path: |
            results/opportunities.csv
            results/opportunities.json
            results/active_candidates.csv
            results/active_candidates.json
            results/fetch_diagnostics.json
            results/daily_report.json
            logs/agent.log
          if-no-files-found: warn

      - name: Commit updated results
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/opportunities.csv results/opportunities.json results/active_candidates.csv results/active_candidates.json results/fetch_diagnostics.json results/daily_report.json
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "Update job alert test run results"
            git pull --rebase origin main
            git push
          fi
